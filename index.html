<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IAD CRM — Gestão comercial orientada à decisão</title>
<meta name="description" content="CRM que administra decisões de compra, evidências do cliente e buying groups — não apenas etapas e atividades.">
<meta name="theme-color" content="#0d2b4e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IAD CRM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <div class="marca">IAD <span>CRM</span></div>
      <div class="sub">O funil organiza. A decisão fecha.</div>
    </div>
    <div class="espaco"></div>
    <div id="quem" class="quem"></div>
    <button onclick="App.capturaRapida()" data-ajuda-titulo="Registrar evidência" data-ajuda="O cliente se moveu. Só isso zera o tempo sem evidência e libera a nota 2." title="Registrar evidência do cliente">+ Evidência</button>
    <button onclick="App.ir('#/playbook')" data-ajuda-titulo="Playbook" data-ajuda="As oito decisões em detalhe: o que cada uma quer saber e como provocá-la em cada canal." title="Playbook da decisão">🎯</button>
    <button onclick="App.ir('#/dados')" data-ajuda-titulo="Dados" data-ajuda="Nuvem, Linked Helper, backup, importação e demonstração." title="Dados e instalação">⚙︎</button>
    <button onclick="App.sair()" data-ajuda-titulo="Sair" data-ajuda="Encerra a sessão neste aparelho. Os dados sincronizados continuam no servidor." title="Sair">⏻</button>
  </header>
  <nav class="tabs"></nav>
  <div class="col"><div id="barra-admin"></div><main id="conteudo"></main></div>
</div>

<script src="src/config.js"></script>
  <script src="src/playbook.js"></script>

</html>
