<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IAD CRM — Gestão comercial orientada à decisão</title>
<meta name="description" content="CRM que administra decisões de compra, evidências do cliente e buying groups — não apenas etapas e atividades.">
<meta name="theme-color" content="#0d2b4e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IAD CRM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <div class="marca">IAD <span>CRM</span></div>
      <div class="sub">O funil organiza. A decisão fecha.</div>
    </div>
    <div class="espaco"></div>
    <div class="quem-caixa">
      <button id="quem" class="quem" onclick="App.menuUsuario(event)" aria-haspopup="true" aria-expanded="false"
              title="Sua conta: empresa ativa, troca de conta, senha e sair"></button>
      <div id="menu-quem" class="menu-quem" hidden></div>
    </div>
    <button onclick="App.ir('#/playbook')" data-ajuda-titulo="O método" data-ajuda="A teoria inteira: como uma tarefa vira avanço, o que conta como evidência em cada uma das oito decisões, e o que fazer em cada canal." title="O método">❓</button>
    <button onclick="App.sair()" data-ajuda-titulo="Sair" data-ajuda="Encerra a sessão neste aparelho. Os dados sincronizados continuam no servidor." title="Sair">⏻</button>
  </header>
  <nav class="tabs"></nav>
  <div class="col"><div id="barra-admin"></div><div id="aviso-sinc"></div><main id="conteudo"></main></div>
</div>
