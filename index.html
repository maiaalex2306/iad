<!-- Captura recuperação antes de carregar o CRM, sua sincronização e seu roteador.
     A URL do Supabase continua apontando para /, já autorizada no dashboard. -->
<script>
(function () {
  var h = new URLSearchParams((location.hash || '').slice(1));
  var q = new URLSearchParams((location.search || '').slice(1));
  var tipo = h.get('type') || q.get('type');
  var recuperacao = (tipo === 'recovery' || tipo === 'invite') &&
    (h.has('access_token') || h.has('token_hash') || q.has('token_hash') || q.has('code'));
  var erro = h.has('error') || h.has('error_code') || q.has('error') || q.has('error_code');
  if (recuperacao || erro) {
    location.replace('/recuperar.html' + location.search + location.hash);
  }
})();
</script>
