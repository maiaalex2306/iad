name: PERF-10 — Cockpit e Tarefas
on:
  push:
    branches: [performance/perf-10-cockpit-fast-tabs-v282]
  pull_request:
    branches: [claude/decisoes-estagios-vendas-eckjo0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cockpit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/views.js && node --check src/app.js && node --check src/store.js
      - run: node --test nuvem/testes/perf-10-cockpit.test.cjs nuvem/testes/perf-10-percentis.test.cjs
      - name: Garantir versão de produção inalterada
        run: |
          grep -q "numero: 'v282'" src/config.js
          grep -q 'iad-crm-v282' sw.js
