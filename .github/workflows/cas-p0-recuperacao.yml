name: CAS P0 — Recuperação sem perda
on:
  pull_request:
    branches: [claude/decisoes-estagios-vendas-eckjo0]
  push:
    branches: [fix/cas-pendencias-recuperacao-v285]
permissions:
  contents: read
jobs:
  cas-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/nuvem.js && node --check src/app.js && node --check src/views.js
      - run: node --test nuvem/testes/cas-p0-recuperacao.test.cjs
