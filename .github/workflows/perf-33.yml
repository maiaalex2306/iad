name: PERF-33 — Cockpit async targeted refresh and auth safety
on:
  pull_request:
    branches: [claude/decisoes-estagios-vendas-eckjo0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cockpit-async:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe dos arquivos modificados
        run: |
          node --check src/views.js
          node --check src/app.js
          node --check src/performance.js
          node --check scripts/perf33-cockpit-async.test.cjs
          node scripts/verificar-versao-shell.cjs
      - name: Segurança, DOM preservado, canais assincronos e paridade
        run: |
          node --test scripts/perf33-cockpit-async.test.cjs
          node --test nuvem/testes/perf-31-cockpit-attribution.test.cjs nuvem/testes/perf-24-inapp-diagnostics.test.cjs
          node --test nuvem/testes/perf-10-cockpit.test.cjs nuvem/testes/perf-10-p8-lazy.test.cjs
          node --test scripts/perf32-regression.cjs
