name: PERF-31 — Attribution of cockpit latency
on:
  pull_request:
    branches: [claude/decisoes-estagios-vendas-eckjo0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  perf31:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/views.js
          node --check src/performance.js
          node --check nuvem/testes/perf-31-cockpit-attribution.test.cjs
      - name: Attribution, privacy and existing metrics regressions
        run: |
          node --test nuvem/testes/perf-31-cockpit-attribution.test.cjs
          node --test nuvem/testes/perf-24-inapp-diagnostics.test.cjs
      - name: Coordinated release version
        run: |
          node scripts/verificar-versao-shell.cjs
