name: PERF-10 P8 — Cockpit lazy HEINEKEN
on:
  push:
    branches: [performance/perf-10-p8-lazy-cockpit-v286]
  pull_request:
    branches: [claude/decisoes-estagios-vendas-eckjo0]
permissions:
  contents: read
jobs:
  cockpit-lazy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/app.js && node --check src/views.js
      - run: node --test nuvem/testes/perf-10-p8-lazy.test.cjs
      - run: node --test nuvem/testes/perf-10-cockpit.test.cjs
