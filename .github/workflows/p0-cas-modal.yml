name: P0 CAS — Prevent blocking sync modal
on:
  pull_request:
    branches: [claude/decisoes-estagios-vendas-eckjo0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  modal-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Modal behavior, version and CAS safety regression
        run: |
          node --check src/app.js
          node --check src/nuvem.js
          node scripts/verificar-versao-shell.cjs
          node --test scripts/p0-cas-modal.test.cjs
          node --test scripts/p0-cas-assisted-resolution.test.cjs
          node --test scripts/p0-cas-proven-satisfied.test.cjs
          node --test scripts/p0-cas-failclosed.test.cjs
