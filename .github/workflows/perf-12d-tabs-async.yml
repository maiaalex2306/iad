name: PERF-12D — abas e anexos assíncronos
on:
  push:
    branches: ['performance/perf-12d-tabs-async-file-v2866']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check src/app.js
      - run: node --test nuvem/testes/perf-12d-tabs-async.test.cjs
      - run: node --test nuvem/testes/*.test.cjs
