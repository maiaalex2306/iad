name: PERF-13E — Sync render guard v286.9
on:
  push:
    branches: ['performance/perf-13e-sync-render-guard-v2869']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/app.js
      - run: node --test nuvem/testes/perf-13e-sync-render-guard.test.cjs
      - run: node --test nuvem/testes/*.test.cjs
