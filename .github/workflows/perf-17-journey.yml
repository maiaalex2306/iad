name: PERF-17 — Cockpit Journey e Adocao por Revisao
on:
  pull_request:
    branches: [claude/decisoes-estagios-vendas-eckjo0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  perf17-unit:
    name: PERF-17 contrato P95, isolamento e revisao
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/app.js && node --check src/store.js && node --check src/performance.js
      - run: node --check scripts/perf17-journey-browser.cjs
      - run: node --test nuvem/testes/perf-17-journey-adoption.test.cjs
      - run: node --test nuvem/testes/perf-15-contacts-index.test.cjs nuvem/testes/perf-10-percentis.test.cjs
  perf17-browser:
    name: PERF-17 Chromium clique-dois-frames
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium isolado
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Jornada sintetica sem dados reais
        run: timeout 120s node scripts/perf17-journey-browser.cjs
