name: P0 — impedir IA automatica ao navegar
on:
  push:
    branches: ['hotfix/disable-unrequested-email-ai-p0']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/app.js
      - run: node --test nuvem/testes/p0-no-automatic-ai.test.cjs
      - run: node --test nuvem/testes/*.test.cjs
      - name: Release gate
        run: |
          grep -q "numero: 'v286'" src/config.js
          grep -q 'iad-crm-v286' sw.js
