name: Isolated password recovery E2E contract
on:
  pull_request:
    branches:
      - claude/decisoes-estagios-vendas-eckjo0
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: |
          node --check src/recuperacao.js
          node --check src/views.js
          node --check src/app.js
          node --check src/config.js
          node --check sw.js
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check invitation Edge Function
        run: deno check nuvem/funcoes/convite/index.ts
      - name: Test password recovery against mocked Supabase Auth
        run: node --test nuvem/testes/recuperacao-isolada.test.cjs
