name: P0 CAS — Protected read-only portfolio
on:
  pull_request:
    branches: [claude/decisoes-estagios-vendas-eckjo0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Session, pagination, read-only isolation, CAS regressions
        run: |
          node --check src/nuvem.js
          node --check src/app.js
          node scripts/verificar-versao-shell.cjs
          node --test scripts/p0-cas-readonly-portfolio.test.cjs
          node --test scripts/p0-cas-missing-base.test.cjs
          node --test scripts/p0-cas-modal.test.cjs
          node --test scripts/p0-cas-assisted-resolution.test.cjs
          node --test scripts/p0-cas-proven-satisfied.test.cjs
          node --test scripts/p0-cas-failclosed.test.cjs
