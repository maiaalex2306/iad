name: P0 CAS — Privacy-safe recovery diagnostics
on:
  pull_request:
    branches: [claude/decisoes-estagios-vendas-eckjo0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cas-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and release integrity
        run: |
          node --check src/nuvem.js
          node --check src/views.js
          node scripts/verificar-versao-shell.cjs
      - name: Recovery regression
        run: |
          node --test scripts/p0-cas-diagnostics.test.cjs
          node --test scripts/p0-cas-cross-instance.test.cjs
          node --test nuvem/testes/cas-p0-recuperacao.test.cjs
          node --test scripts/perf34b-whatsapp.test.cjs
