name: PERF-04 P5c — Integração shadow
on:
  push:
    branches: [performance/iad-perf-04-p5c-integration-v280]
  pull_request:
    branches: [claude/decisoes-estagios-vendas-eckjo0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regressoes de segurança e paridade
        run: |
          node --check src/incremental.js
          node --check src/p5b-shadow.js
          node --check src/views.js
          node --test nuvem/testes/perf-04-p5b-incremental.test.cjs nuvem/testes/perf-04-p5b-shadow.test.cjs
      - name: Feature flag desligada por padrão
        run: |
          grep -q 'global.IAD_P5C_SHADOW === true' src/views.js
          ! grep -Eq 'IAD_P5C_SHADOW\s*=\s*true' index.html
          grep -q "numero: 'v286'" src/config.js
          grep -q "iad-crm-v286" sw.js
