name: RI-08 linkedhelper commercial intent
on:
  pull_request:
    paths:
      - 'src/ri/conversation-intent.mjs'
      - 'src/ri/internal-cues.mjs'
      - 'src/ri/account-view.mjs'
      - 'src/ri/opportunity-radar.mjs'
      - 'src/ia.js'
      - 'src/app.js'
      - 'src/views.js'
      - 'nuvem/funcoes/assistente/index.ts'
      - 'tests/ri08-conversation-intent.test.mjs'
      - 'tests/ri08-performance.test.mjs'
      - 'scripts/ri08-linkedhelper-browser.cjs'
      - '.github/workflows/ri08-conversation-intent.yml'
  workflow_dispatch:
jobs:
  intents-and-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate javascript syntax
        run: |
          node --check src/ia.js
          node --check src/app.js
          node --check src/views.js
          node --check src/ri/conversation-intent.mjs
          node --check src/ri/internal-cues.mjs
          node --check src/ri/account-view.mjs
      - name: Run focused regression tests
        run: node --test tests/ri08-conversation-intent.test.mjs scripts/ri07a-internal-cues.test.cjs
      - name: Benchmark 5000 opportunities and revision-safe cache
        run: node --test tests/ri08-performance.test.mjs

  browser-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Replay import preview in real browser
        run: timeout 150s node scripts/ri08-linkedhelper-browser.cjs
  staging-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Regression tests for release gate (no secrets)
        run: node --test scripts/ri08-staging-readiness.test.cjs
      - name: Fail closed when staging AI is unavailable
        run: node scripts/ri08-staging-readiness.cjs
