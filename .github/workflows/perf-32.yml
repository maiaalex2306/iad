name: PERF-32 — Paridade de tarefas e catalogos
on:
  pull_request:
    branches: [claude/decisoes-estagios-vendas-eckjo0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  perf32:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe e regressao funcional exata contra producao
        run: |
          node --check src/views.js
          node --check src/app.js
          node --check scripts/perf32-regression.cjs
          node --test scripts/perf32-regression.cjs
      - name: Regressao do cockpit, seguranca e Decision Engine
        run: |
          node --test nuvem/testes/perf-10-cockpit.test.cjs nuvem/testes/perf-31-cockpit-attribution.test.cjs
          node --test nuvem/testes/perf-02-engine.test.cjs nuvem/testes/perf-02-cache.test.cjs
          node --test nuvem/testes/perf-29-email-unread-fastpath.test.cjs
