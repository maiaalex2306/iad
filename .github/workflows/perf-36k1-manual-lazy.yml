name: PERF-36K1 - Manual sob demanda, DOM paridade e PWA
on:
  pull_request:
    branches: [claude/decisoes-estagios-vendas-eckjo0]
    paths:
      - 'src/views.js'
      - 'src/views-manual.js'
      - 'src/app.js'
      - 'src/config.js'
      - 'sw.js'
      - 'tests/perf36k1-manual-lazy.test.cjs'
      - '.github/workflows/perf-36k1-manual-lazy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manual-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe e paridade exata da tela Método contra v286.74
        run: |
          node --check src/views.js
          node --check src/views-manual.js
          node --check src/app.js
          node --check sw.js
          node --test tests/perf36k1-manual-lazy.test.cjs
