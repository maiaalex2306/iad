name: Auth recovery regression
on:
  pull_request:
    branches:
      - claude/decisoes-estagios-vendas-eckjo0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-and-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Check browser JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/ui.js
          node --check src/views.js
          node --check src/nuvem.js
          node --check src/config.js
          node --check sw.js
      - name: Run recovery and invite routing regression
        run: bun nuvem/testes/recuperacao-senha.test.ts
