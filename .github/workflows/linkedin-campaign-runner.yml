name: LinkedIN Leads — Motor real de campanhas (testes de contratos)
on:
  push:
    branches:
      - feature/linkedin-campaign-executor-core-20261107
    paths:
      - 'src/linkedin-campaign-runner.mjs'
      - 'tests/linkedin-campaign-runner.test.mjs'
      - '.github/workflows/linkedin-campaign-runner.yml'
  pull_request:
    paths:
      - 'src/linkedin-campaign-runner.mjs'
      - 'tests/linkedin-campaign-runner.test.mjs'
      - '.github/workflows/linkedin-campaign-runner.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linkedin-executor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  executor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS contracts
        run: |
          node --check src/linkedin-campaign-runner.mjs
          node --check tests/linkedin-campaign-runner.test.mjs
      - name: Replay 13 cenários com adaptador simulado
        run: node --test tests/linkedin-campaign-runner.test.mjs
