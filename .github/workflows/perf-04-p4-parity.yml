name: PERF-04 P4 — Paridade da carteira
on:
  push:
    branches: [performance/iad-perf-04-p4-carteira-single-pass]
  pull_request:
    branches: [claude/decisoes-estagios-vendas-eckjo0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  carteira-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/engine.js && node --check scripts/perf04-p4-parity.cjs
      - name: Paridade byte a byte de indicadores 0 a 5000
        run: node scripts/perf04-p4-parity.cjs
      - name: Verificar v278 preservada
        run: |
          grep -q "numero: 'v278'" src/config.js
          grep -q "iad-crm-v278" sw.js
