name: PERF-04 P5b — Incremental isolado
on:
  push:
    branches: [performance/iad-perf-04-p5b-incremental-aggregates]
  pull_request:
    branches: [claude/decisoes-estagios-vendas-eckjo0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/incremental.js && node --test nuvem/testes/perf-04-p5b-incremental.test.cjs
      - name: Validar baseline da branch sem alterar produção
        run: grep -Eq "numero: 'v27(7|8)'" src/config.js
