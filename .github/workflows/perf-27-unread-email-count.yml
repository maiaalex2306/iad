name: PERF-27 — Unread email counter parity
on:
  pull_request:
    branches: [claude/decisoes-estagios-vendas-eckjo0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  perf27:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/email.js && node --check nuvem/testes/perf-27-unread-email-count.test.cjs
      - run: node --test nuvem/testes/perf-27-unread-email-count.test.cjs
      - name: Ensure version and PWA match
        run: |
          grep -q "numero: 'v286.29'" src/config.js
          grep -q "iad-crm-v286.29" sw.js
