name: P0 CAS — Fail-closed download guard
on:
  pull_request:
    branches: [claude/decisoes-estagios-vendas-eckjo0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  failclosed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, release, loss prevention
        run: |
          node --check src/nuvem.js
          node --check scripts/p0-cas-failclosed.test.cjs
          node scripts/verificar-versao-shell.cjs
          node --test scripts/p0-cas-failclosed.test.cjs
          node --test scripts/p0-cas-diagnostics.test.cjs
          node --test scripts/p0-cas-cross-instance.test.cjs
          node --test nuvem/testes/cas-p0-recuperacao.test.cjs
