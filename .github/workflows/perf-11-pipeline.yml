name: PERF-11 — Pipeline, anexos e sincronização
on:
  push:
    branches:
      - 'performance/perf-11-*'
  pull_request:
    branches:
      - 'performance/perf-10-p8-lazy-cockpit-v286'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  perf-11:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir integridade sintática de todos os programas alterados
        run: |
          node --check src/pipeline-performance.js
          node --check src/views.js
          node --check src/nuvem.js
          node --check src/arquivos.js
          node --check nuvem/testes/perf-11-pipeline.test.cjs
      - name: Regressões PERF-11 (389 oportunidades sintéticas)
        run: node --test nuvem/testes/perf-11-pipeline.test.cjs
      - name: Regressões dos caches, Pipeline e segurança da navegação
        run: |
          node --test nuvem/testes/perf-03a-pipeline.test.cjs
          node --test nuvem/testes/perf-03a-integridade.test.cjs
          node --test nuvem/testes/perf-03b.test.cjs
          node --test nuvem/testes/perf-04-p5d-events.test.cjs
          node --test nuvem/testes/perf-04-p5e-pipeline.test.cjs
          node --test nuvem/testes/perf-10-cockpit.test.cjs
          node --test nuvem/testes/perf-10-p8-lazy.test.cjs
      - name: Proibir alteração de versão antes de homologação
        run: |
          grep -q "numero: 'v286'" src/config.js
          grep -q "iad-crm-v286" sw.js
