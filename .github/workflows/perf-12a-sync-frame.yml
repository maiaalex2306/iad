name: PERF-12A — Sync frame coalescing
on:
  push:
    branches: ['performance/perf-12a-sync-frame-coalesce']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check src/app.js
      - run: node --test nuvem/testes/perf-12a-sync-frame.test.cjs
      - run: node --test nuvem/testes/*.test.cjs
