name: P0 CAS — Partial ACK reconciliation
on:
  pull_request:
    branches: [claude/decisoes-estagios-vendas-eckjo0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  partial-ack:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and regression
        run: |
          node --check src/cas-queue.js
          node --check src/nuvem.js
          node scripts/verificar-versao-shell.cjs
          node --test scripts/p0-cas-partial-ack.test.cjs
          node --test scripts/p0-cas-cross-instance.test.cjs
          node --test scripts/p0-cas-failclosed.test.cjs
          node --test scripts/p0-cas-diagnostics.test.cjs
          node --test nuvem/testes/cas-p0-recuperacao.test.cjs
