name: RI-M01 — E2E real de ChatGPT e Claude (homologação)
on:
  push:
    branches:
      - feature/ri-m01-atomic-quota-20261104
    paths:
      - .github/workflows/ri-m01-live-e2e.yml
  workflow_dispatch:
  pull_request:
    branches:
      - claude/decisoes-estagios-vendas-eckjo0
    paths:
      - .github/workflows/ri-m01-live-e2e.yml
permissions:
  contents: read
jobs:
  live-research:
    if: github.event_name != 'pull_request' || github.head_ref == 'qa/ri-m01-live-staging-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: homologacao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Contratos de E2E (sem consumo de IA)
        run: node --test tests/market-staging-e2e.test.mjs
      - name: Pesquisa autenticada com OpenAI + Claude na Edge de homologação
        env:
          RI_M01_STAGING_EMAIL: ${{ secrets.RI_M01_STAGING_EMAIL }}
          RI_M01_STAGING_PASSWORD: ${{ secrets.RI_M01_STAGING_PASSWORD }}
          RI_M01_STAGING_ANON_KEY: ${{ secrets.RI_M01_STAGING_ANON_KEY }}
        run: node scripts/ri-m01-staging-e2e.mjs
