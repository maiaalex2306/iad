name: PERF-11G — Telemetria local segura e sem regressao
on:
  push:
    branches: ['performance/perf-11g-local-observability']
  pull_request:
    branches: ['performance/perf-11f-browser-p95-v287']
permissions:
  contents: read
jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe e privacidade
        run: |
          node --check src/performance.js
          node --check nuvem/testes/perf-11g-observability.test.cjs
          node --test nuvem/testes/perf-11g-observability.test.cjs
      - name: Suite integral
        run: node --test nuvem/testes/*.test.cjs
      - name: Manter configuracao e PWA atual de producao
        run: |
          grep -q "numero: 'v286'" src/config.js
          grep -q 'iad-crm-v286' sw.js

  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        order: [baseline-first, candidate-first]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium e Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Comparar DOM e P95 com v286; testar diagnóstico local opt-in
        env:
          PERF11F_ORDER: ${{ matrix.order }}
        run: node scripts/perf11f-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf11g-browser-${{ matrix.order }}
          path: perf11f-results/
          if-no-files-found: ignore
